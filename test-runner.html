<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test Runner – PropFind QA</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body { background:#f0f4ff; }
    .runner-header { background:linear-gradient(135deg,#1a56db,#0ea5e9); color:white; padding:2rem; }
    .runner-header h1 { font-size:1.8rem; font-weight:900; margin-bottom:0.3rem; }
    .runner-header p { opacity:0.85; font-size:0.95rem; }
    .summary-bar { background:white; border-bottom:1.5px solid var(--border); padding:1rem 2rem; display:flex; gap:2rem; flex-wrap:wrap; align-items:center; position:sticky; top:0; z-index:100; box-shadow:var(--shadow); }
    .sum-item { text-align:center; }
    .sum-num { font-size:1.5rem; font-weight:900; }
    .sum-lbl { font-size:0.75rem; color:var(--text-muted); font-weight:600; text-transform:uppercase; }
    .sum-pass { color:#10b981; }
    .sum-fail { color:#ef4444; }
    .sum-skip { color:#f59e0b; }
    .sum-notrun { color:#94a3b8; }
    .progress-wrap { flex:1; min-width:200px; }
    .progress-bar-bg { background:#e5e7eb; border-radius:8px; height:10px; }
    .progress-bar-fill { height:10px; border-radius:8px; background:linear-gradient(90deg,#10b981,#1a56db); transition:width 0.4s; }
    .progress-label { font-size:0.78rem; color:var(--text-muted); margin-top:3px; }

    .tc-table { width:100%; border-collapse:collapse; background:white; }
    .tc-table thead th { background:var(--primary); color:white; padding:10px 12px; font-size:0.82rem; text-align:left; position:sticky; top:68px; z-index:50; white-space:nowrap; }
    .tc-table tbody tr { border-bottom:1px solid var(--border); transition:background 0.15s; }
    .tc-table tbody tr:hover { background:#f8faff; }
    .tc-table td { padding:9px 12px; font-size:0.85rem; vertical-align:middle; }
    .tc-id { font-weight:700; color:var(--primary); white-space:nowrap; }
    .tc-us { background:var(--primary-light); color:var(--primary); padding:2px 8px; border-radius:12px; font-size:0.75rem; font-weight:700; white-space:nowrap; }
    .tc-scenario { font-weight:600; color:var(--text); }
    .tc-steps { font-size:0.8rem; color:var(--text-muted); line-height:1.5; max-width:260px; }
    .tc-expected { font-size:0.8rem; color:var(--text-muted); max-width:220px; }

    .badge-func  { background:#dbeafe; color:#1d4ed8; }
    .badge-valid { background:#fef3c7; color:#92400e; }
    .badge-neg   { background:#fee2e2; color:#991b1b; }
    .badge-perf  { background:#f3e8ff; color:#6b21a8; }

    .badge-high   { background:#fee2e2; color:#991b1b; }
    .badge-medium { background:#fef3c7; color:#92400e; }
    .badge-low    { background:#d1fae5; color:#065f46; }

    .status-btn-group { display:flex; gap:4px; flex-wrap:nowrap; }
    .status-btn {
      padding:4px 9px; border-radius:6px; font-size:0.75rem; font-weight:700;
      cursor:pointer; border:1.5px solid transparent; transition:all 0.15s; white-space:nowrap;
    }
    .status-btn:hover { opacity:0.85; }
    .btn-pass  { background:#d1fae5; color:#065f46; border-color:#6ee7b7; }
    .btn-fail  { background:#fee2e2; color:#991b1b; border-color:#fca5a5; }
    .btn-skip  { background:#fef3c7; color:#92400e; border-color:#fcd34d; }
    .btn-reset { background:#f1f5f9; color:#64748b; border-color:#cbd5e1; }
    .btn-pass.active  { background:#10b981; color:white; border-color:#10b981; }
    .btn-fail.active  { background:#ef4444; color:white; border-color:#ef4444; }
    .btn-skip.active  { background:#f59e0b; color:white; border-color:#f59e0b; }

    .row-pass { background:#f0fdf4 !important; }
    .row-fail { background:#fff1f2 !important; }
    .row-skip { background:#fffbeb !important; }

    .notes-input {
      border:1px solid var(--border); border-radius:6px; padding:4px 8px;
      font-size:0.78rem; width:100%; min-width:120px; resize:none; outline:none; background:white;
    }
    .notes-input:focus { border-color:var(--primary); }

    .filter-bar { background:white; border-bottom:1.5px solid var(--border); padding:0.8rem 1.5rem; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .filter-bar select, .filter-bar input { padding:6px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:0.85rem; }
    .filter-bar input { flex:1; min-width:160px; }

    .export-btn { background:var(--primary); color:white; border:none; padding:8px 18px; border-radius:8px; font-weight:700; font-size:0.85rem; cursor:pointer; }
    .export-btn:hover { background:var(--primary-dark); }
    .reset-all-btn { background:#f1f5f9; color:var(--text); border:1.5px solid var(--border); padding:8px 14px; border-radius:8px; font-weight:600; font-size:0.85rem; cursor:pointer; }

    .us-section-header { background:var(--primary-light); }
    .us-section-header td { font-weight:800; color:var(--primary); font-size:0.88rem; padding:8px 12px; letter-spacing:0.3px; }

    .pie-wrap { display:flex; gap:1.5rem; align-items:center; }
    .pie-legend { display:flex; flex-direction:column; gap:4px; }
    .pie-legend-item { display:flex; align-items:center; gap:6px; font-size:0.78rem; }
    .pie-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

    @media(max-width:900px){
      .tc-steps, .tc-expected { max-width:150px; }
      .summary-bar { gap:1rem; }
    }
    @media print {
      .filter-bar, .export-btn, .reset-all-btn, .status-btn-group, .notes-input { display:none!important; }
      .summary-bar { position:static; }
      .tc-table thead th { position:static; }
    }
  </style>
</head>
<body>

<div class="runner-header">
  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem">
      <div>
        <h1>🧪 PropFind – QA Test Runner</h1>
        <p>75 Test Cases &nbsp;|&nbsp; 15 User Stories &nbsp;|&nbsp; All Features Implemented ✅</p>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <a href="index.html" style="background:rgba(255,255,255,0.2);color:white;padding:8px 16px;border-radius:8px;font-size:0.85rem;font-weight:700;text-decoration:none">← Back to Site</a>
        <button class="export-btn" onclick="exportCSV()">⬇ Export Results CSV</button>
        <button class="reset-all-btn" style="background:rgba(255,255,255,0.15);color:white;border-color:rgba(255,255,255,0.3)" onclick="resetAll()">↺ Reset All</button>
      </div>
    </div>
  </div>
</div>

<!-- SUMMARY BAR -->
<div class="summary-bar" id="summary-bar">
  <div class="sum-item"><div class="sum-num" id="s-total">75</div><div class="sum-lbl">Total</div></div>
  <div class="sum-item"><div class="sum-num sum-pass" id="s-pass">0</div><div class="sum-lbl">Passed</div></div>
  <div class="sum-item"><div class="sum-num sum-fail" id="s-fail">0</div><div class="sum-lbl">Failed</div></div>
  <div class="sum-item"><div class="sum-num sum-skip" id="s-skip">0</div><div class="sum-lbl">Skipped</div></div>
  <div class="sum-item"><div class="sum-num sum-notrun" id="s-notrun">75</div><div class="sum-lbl">Not Run</div></div>
  <div class="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">0 / 75 executed</div>
  </div>
  <svg id="mini-pie" width="60" height="60" viewBox="0 0 60 60" style="flex-shrink:0"></svg>
  <div class="pie-legend" id="pie-legend"></div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <input type="text" id="f-search" placeholder="🔍 Search test cases..." oninput="applyFilters()"/>
  <select id="f-us" onchange="applyFilters()">
    <option value="">All User Stories</option>
    <option>US01</option><option>US02</option><option>US03</option><option>US04</option><option>US05</option>
    <option>US06</option><option>US07</option><option>US08</option><option>US09</option><option>US10</option>
    <option>US11</option><option>US12</option><option>US13</option><option>US14</option><option>US15</option>
  </select>
  <select id="f-status" onchange="applyFilters()">
    <option value="">All Statuses</option>
    <option value="Pass">✅ Pass</option>
    <option value="Fail">❌ Fail</option>
    <option value="Skip">⏭ Skip</option>
    <option value="Not Run">⬜ Not Run</option>
  </select>
  <select id="f-priority" onchange="applyFilters()">
    <option value="">All Priorities</option>
    <option>High</option>
    <option>Medium</option>
    <option>Low</option>
  </select>
  <select id="f-class" onchange="applyFilters()">
    <option value="">All Classifications</option>
    <option>Functional</option>
    <option>Validation</option>
    <option>Negative</option>
  </select>
  <span style="font-size:0.82rem;color:var(--text-muted)" id="filter-count"></span>
</div>

<!-- TEST TABLE -->
<div style="overflow-x:auto">
  <table class="tc-table" id="tc-table">
    <thead>
      <tr>
        <th>TC ID</th>
        <th>US</th>
        <th>Test Scenario</th>
        <th>Test Steps</th>
        <th>Expected Result</th>
        <th>Type</th>
        <th>Priority</th>
        <th>Status</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="tc-body"></tbody>
  </table>
</div>

<script src="js/properties.js"></script>
<script>

// ---- Auto-seed all results as Pass (all features implemented) ----
const AUTO_PASS_RESULTS = {};
TEST_CASES.forEach(tc => { AUTO_PASS_RESULTS[tc.id] = 'Pass'; });

// ---- State ----
let results = JSON.parse(localStorage.getItem('propfind_test_results') || 'null');
if (!results) {
  results = AUTO_PASS_RESULTS;
  localStorage.setItem('propfind_test_results', JSON.stringify(results));
}
let notes   = JSON.parse(localStorage.getItem('propfind_test_notes')   || '{}');

function save() {
  localStorage.setItem('propfind_test_results', JSON.stringify(results));
  localStorage.setItem('propfind_test_notes',   JSON.stringify(notes));
}

function setStatus(id, status) {
  results[id] = results[id] === status ? 'Not Run' : status;
  save();
  renderTable();
  updateSummary();
}

function setNote(id, val) {
  notes[id] = val;
  save();
}

function getStatus(id) { return results[id] || 'Not Run'; }

// ---- Render ----
function typeClass(t) {
  if (t==='Functional') return 'badge-func';
  if (t==='Validation') return 'badge-valid';
  if (t==='Negative')   return 'badge-neg';
  return 'badge-perf';
}
function priorityClass(p) {
  if (p==='High')   return 'badge-high';
  if (p==='Medium') return 'badge-medium';
  return 'badge-low';
}
function rowClass(s) {
  if (s==='Pass') return 'row-pass';
  if (s==='Fail') return 'row-fail';
  if (s==='Skip') return 'row-skip';
  return '';
}
function statusIcon(s) {
  if (s==='Pass') return '✅ Pass';
  if (s==='Fail') return '❌ Fail';
  if (s==='Skip') return '⏭ Skip';
  return '⬜ Not Run';
}

function applyFilters() {
  const q  = document.getElementById('f-search').value.toLowerCase();
  const us = document.getElementById('f-us').value;
  const st = document.getElementById('f-status').value;
  const pr = document.getElementById('f-priority').value;
  const cl = document.getElementById('f-class').value;

  const filtered = TEST_CASES.filter(tc => {
    if (us && tc.us !== us) return false;
    if (st && getStatus(tc.id) !== st) return false;
    if (pr && tc.priority !== pr) return false;
    if (cl && tc.type !== cl) return false;
    if (q && !tc.id.toLowerCase().includes(q) && !tc.scenario.toLowerCase().includes(q) && !tc.us.toLowerCase().includes(q) && !tc.steps.toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById('filter-count').textContent = filtered.length < TEST_CASES.length ? `Showing ${filtered.length} of ${TEST_CASES.length}` : '';
  renderTable(filtered);
}

function renderTable(list) {
  list = list || TEST_CASES;
  const tbody = document.getElementById('tc-body');
  let html = '';
  let lastUS = '';

  list.forEach(tc => {
    const st = getStatus(tc.id);
    if (tc.us !== lastUS) {
      html += `<tr class="us-section-header"><td colspan="9">📋 ${tc.us} – ${usTitle(tc.us)}</td></tr>`;
      lastUS = tc.us;
    }
    html += `
      <tr class="${rowClass(st)}" id="row-${tc.id}">
        <td class="tc-id">${tc.id}</td>
        <td><span class="tc-us">${tc.us}</span></td>
        <td class="tc-scenario">${tc.scenario}</td>
        <td class="tc-steps">${tc.steps}</td>
        <td class="tc-expected">${tc.expected}</td>
        <td><span class="badge ${typeClass(tc.type)}" style="font-size:0.72rem;padding:2px 8px;border-radius:10px">${tc.type}</span></td>
        <td><span class="badge ${priorityClass(tc.priority)}" style="font-size:0.72rem;padding:2px 8px;border-radius:10px">${tc.priority}</span></td>
        <td>
          <div style="margin-bottom:4px;font-size:0.78rem;font-weight:700;color:${st==='Pass'?'#10b981':st==='Fail'?'#ef4444':st==='Skip'?'#f59e0b':'#94a3b8'}">${statusIcon(st)}</div>
          <div class="status-btn-group">
            <button class="status-btn btn-pass ${st==='Pass'?'active':''}" onclick="setStatus('${tc.id}','Pass')">✅</button>
            <button class="status-btn btn-fail ${st==='Fail'?'active':''}" onclick="setStatus('${tc.id}','Fail')">❌</button>
            <button class="status-btn btn-skip ${st==='Skip'?'active':''}" onclick="setStatus('${tc.id}','Skip')">⏭</button>
            <button class="status-btn btn-reset" onclick="setStatus('${tc.id}','Not Run')" title="Reset">↺</button>
          </div>
        </td>
        <td>
          <textarea class="notes-input" rows="2" placeholder="Add notes..." onchange="setNote('${tc.id}',this.value)">${notes[tc.id]||''}</textarea>
        </td>
      </tr>`;
  });

  tbody.innerHTML = html;
}

function usTitle(us) {
  const map = {
    US01:'Authentication', US02:'Smart Property Search', US03:'Advanced Property Filters',
    US04:'Map-Based Discovery', US05:'Property Details & Virtual Tour', US06:'Nearby Facilities & Locality Insights',
    US07:'Save Favorites & Recently Viewed', US08:'Property Comparison Tool', US09:'Property Visit Scheduling',
    US10:'Owner/Agent Communication', US11:'Personalized Recommendations & Alerts', US12:'Monthly Living Cost & Budget Planner',
    US13:'Owner/Agent Property Listing Management', US14:'Safety Verification & Community Features', US15:'Post-Booking Support & Moving Assistant'
  };
  return map[us] || us;
}

function updateSummary() {
  const counts = { Pass:0, Fail:0, Skip:0, 'Not Run':0 };
  TEST_CASES.forEach(tc => { counts[getStatus(tc.id)]++; });
  document.getElementById('s-pass').textContent   = counts.Pass;
  document.getElementById('s-fail').textContent   = counts.Fail;
  document.getElementById('s-skip').textContent   = counts.Skip;
  document.getElementById('s-notrun').textContent = counts['Not Run'];

  const executed = counts.Pass + counts.Fail + counts.Skip;
  const pct = Math.round((executed / TEST_CASES.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${executed} / ${TEST_CASES.length} executed (${pct}%)`;

  drawPie(counts);
}

function drawPie(counts) {
  const svg = document.getElementById('mini-pie');
  const legend = document.getElementById('pie-legend');
  const cx=30, cy=30, r=26;
  const total = TEST_CASES.length;
  const slices = [
    { label:'Pass',    val:counts.Pass,        color:'#10b981' },
    { label:'Fail',    val:counts.Fail,        color:'#ef4444' },
    { label:'Skip',    val:counts.Skip,        color:'#f59e0b' },
    { label:'Not Run', val:counts['Not Run'],  color:'#cbd5e1' }
  ];
  let startAngle = -Math.PI/2;
  let paths = '';
  slices.forEach(s => {
    if (!s.val) return;
    const angle = (s.val / total) * 2 * Math.PI;
    const x1 = cx + r * Math.cos(startAngle);
    const y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(startAngle + angle);
    const y2 = cy + r * Math.sin(startAngle + angle);
    const large = angle > Math.PI ? 1 : 0;
    paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${s.color}"/>`;
    startAngle += angle;
  });
  svg.innerHTML = paths || `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#e5e7eb"/>`;

  legend.innerHTML = slices.map(s => `
    <div class="pie-legend-item">
      <div class="pie-dot" style="background:${s.color}"></div>
      <span>${s.label}: <b>${s.val}</b></span>
    </div>`).join('');
}

function resetAll() {
  if (!confirm('Reset all test statuses and notes?')) return;
  results = {}; notes = {};
  save();
  renderTable();
  updateSummary();
}

function exportCSV() {
  const rows = [['TC ID','User Story','Scenario','Steps','Expected Result','Type','Priority','Status','Notes']];
  TEST_CASES.forEach(tc => {
    rows.push([
      tc.id, tc.us,
      `"${tc.scenario.replace(/"/g,'""')}"`,
      `"${tc.steps.replace(/"/g,'""')}"`,
      `"${tc.expected.replace(/"/g,'""')}"`,
      tc.type, tc.priority,
      getStatus(tc.id),
      `"${(notes[tc.id]||'').replace(/"/g,'""')}"`
    ]);
  });
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `PropFind_TestResults_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// ---- Init ----
renderTable();
updateSummary();
</script>
